name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'raia/**'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run production build
        run: npm run build
